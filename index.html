<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACORD 25 Certificate Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f7f7f8;
            color: #1a1a1e;
            line-height: 1.5;
        }

        /* Layout */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Header */
        .header {
            border-bottom: 1px solid #e4e4e7;
            background: white;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            max-width: 1280px;
            margin: 0 auto;
        }
        .logo {
            font-weight: 600;
            font-size: 1.25rem;
            letter-spacing: -0.01em;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .nav-links {
            display: flex;
            gap: 24px;
        }
        .nav-links a {
            text-decoration: none;
            color: #52525b;
            font-size: 0.875rem;
            transition: color 0.2s;
        }
        .nav-links a:hover, .nav-links a.active {
            color: #2563eb;
        }

        /* Page Header */
        .page-header {
            padding: 48px 0 32px;
        }
        .page-header-eyebrow {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: #71717a;
            margin-bottom: 8px;
        }
        .page-header-title {
            font-size: 2.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
        }
        .page-header-desc {
            color: #52525b;
            font-size: 1rem;
            max-width: 600px;
        }
        .page-header-actions {
            margin-top: 24px;
            display: flex;
            gap: 12px;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            background: transparent;
        }
        .btn-primary {
            background: #2563eb;
            color: white;
        }
        .btn-primary:hover {
            background: #1d4ed8;
        }
        .btn-outline {
            border-color: #e4e4e7;
            background: white;
        }
        .btn-outline:hover {
            background: #f4f4f5;
        }
        .btn-secondary {
            background: #f4f4f5;
            color: #1a1a1e;
        }
        .btn-secondary:hover {
            background: #e4e4e7;
        }

        /* Cards and Grids */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-bottom: 48px;
        }
        .stat-card {
            background: white;
            border: 1px solid #e4e4e7;
            border-radius: 12px;
            padding: 20px;
        }
        .stat-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #71717a;
        }
        .stat-value {
            font-size: 2.5rem;
            font-weight: 600;
            margin-top: 8px;
        }
        .stat-hint {
            font-size: 0.75rem;
            color: #a1a1aa;
            margin-top: 4px;
        }

        .actions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
            margin-bottom: 48px;
        }
        .action-tile {
            background: white;
            border: 1px solid #e4e4e7;
            border-radius: 12px;
            padding: 20px;
            text-decoration: none;
            transition: all 0.2s;
            display: block;
        }
        .action-tile:hover {
            border-color: #2563eb;
        }
        .action-icon {
            width: 40px;
            height: 40px;
            background: #2563eb10;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            margin-bottom: 16px;
        }
        .action-title {
            font-weight: 600;
            font-size: 1.125rem;
            color: #1a1a1e;
            margin-bottom: 4px;
        }
        .action-desc {
            font-size: 0.875rem;
            color: #71717a;
        }

        /* Tables */
        .table-container {
            background: white;
            border: 1px solid #e4e4e7;
            border-radius: 12px;
            overflow: hidden;
        }
        table {
            width: 100%;
            font-size: 0.875rem;
        }
        th {
            text-align: left;
            padding: 12px 16px;
            background: #fafafa;
            font-weight: 500;
            color: #52525b;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid #e4e4e7;
        }
        td {
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
        }
        tr:last-child td {
            border-bottom: none;
        }

        /* Form Styles */
        .form-section {
            background: white;
            border: 1px solid #e4e4e7;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .form-section-title {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
        }
        .form-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-field label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #71717a;
        }
        input, textarea, select {
            padding: 8px 12px;
            border: 1px solid #e4e4e7;
            border-radius: 8px;
            font-size: 0.875rem;
            font-family: inherit;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #2563eb;
            ring: 2px solid #2563eb20;
        }

        /* Badge */
        .badge {
            display: inline-flex;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 0.7rem;
            text-transform: uppercase;
            background: #f4f4f5;
            color: #52525b;
        }
        .badge-issued {
            background: #dbeafe;
            color: #1d4ed8;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal {
            background: white;
            border-radius: 16px;
            max-width: 600px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 24px;
        }
        .modal-header {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        /* Utility */
        .hidden {
            display: none;
        }
        .text-center {
            text-align: center;
        }
        .py-16 {
            padding: 64px 0;
        }
        .mt-4 {
            margin-top: 16px;
        }
        .mb-4 {
            margin-bottom: 16px;
        }
        .gap-2 {
            gap: 8px;
        }
        .flex {
            display: flex;
        }
        .items-center {
            align-items: center;
        }
        .justify-between {
            justify-content: space-between;
        }
        .justify-end {
            justify-content: flex-end;
        }
        .flex-wrap {
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // --- Utility Functions ---
        function formatDate(dateStr) {
            if (!dateStr) return '—';
            const d = new Date(dateStr);
            return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function generateCertificateNumber() {
            return 'CERT-' + Date.now().toString(36).toUpperCase();
        }

        // Storage keys
        const STORAGE_KEYS = {
            CLIENTS: 'acord_clients',
            PRODUCERS: 'acord_producers',
            HOLDERS: 'acord_holders',
            POLICIES: 'acord_policies',
            CERTIFICATES: 'acord_certificates',
            INSURERS: 'acord_insurers'
        };

        // Initialize storage
        function initStorage() {
            for (const key of Object.values(STORAGE_KEYS)) {
                if (!localStorage.getItem(key)) {
                    localStorage.setItem(key, JSON.stringify([]));
                }
            }
        }
        initStorage();

        function getData(key) { return JSON.parse(localStorage.getItem(key) || '[]'); }
        function setData(key, data) { localStorage.setItem(key, JSON.stringify(data)); }

        function generateId() { return Date.now().toString() + Math.random().toString(36).substr(2, 6); }

        // --- Main App Component (Simple Router) ---
        let currentView = 'dashboard';
        let currentEditId = null;
        let currentClientId = null;

        // State for forms
        let formState = {
            certificate: {
                certificate_number: generateCertificateNumber(),
                revision_number: '',
                issue_date: new Date().toISOString().slice(0, 10),
                client_id: '',
                producer_id: '',
                certificate_holder_id: '',
                description_of_operations: '',
                authorized_representative: '',
                policies: [],
                insurers_snapshot: [
                    { letter: 'A', name: '', naic_number: '' },
                    { letter: 'B', name: '', naic_number: '' },
                    { letter: 'C', name: '', naic_number: '' },
                    { letter: 'D', name: '', naic_number: '' },
                    { letter: 'E', name: '', naic_number: '' },
                    { letter: 'F', name: '', naic_number: '' }
                ],
                status: 'draft'
            }
        };

        let modalOpen = false;
        let modalType = null;

        // Render function
        function render() {
            const app = document.getElementById('app');
            if (!app) return;

            const clients = getData(STORAGE_KEYS.CLIENTS);
            const producers = getData(STORAGE_KEYS.PRODUCERS);
            const holders = getData(STORAGE_KEYS.HOLDERS);
            const policies = getData(STORAGE_KEYS.POLICIES);
            const certificates = getData(STORAGE_KEYS.CERTIFICATES);
            const insurers = getData(STORAGE_KEYS.INSURERS);

            const getClientName = (id) => clients.find(c => c.id === id)?.name || '—';
            const getProducerName = (id) => producers.find(p => p.id === id)?.name || '—';
            const getHolderName = (id) => holders.find(h => h.id === id)?.name || '—';

            let content = '';

            // Navigation
            content = `
                <div class="header">
                    <div class="header-content">
                        <div class="logo">ACORD 25 · Certificate Suite</div>
                        <div class="nav-links">
                            <a href="#" onclick="navigateTo('dashboard'); return false;" class="${currentView === 'dashboard' ? 'active' : ''}">Dashboard</a>
                            <a href="#" onclick="navigateTo('certificates'); return false;" class="${currentView === 'certificates' ? 'active' : ''}">Certificates</a>
                            <a href="#" onclick="navigateTo('clients'); return false;" class="${currentView === 'clients' ? 'active' : ''}">Clients</a>
                            <a href="#" onclick="navigateTo('producers'); return false;" class="${currentView === 'producers' ? 'active' : ''}">Producers</a>
                            <a href="#" onclick="navigateTo('insurers'); return false;" class="${currentView === 'insurers' ? 'active' : ''}">Insurers</a>
                        </div>
                    </div>
                </div>
                <div class="container">
            `;

            // Render based on current view
            if (currentView === 'dashboard') {
                const recentCerts = [...certificates].reverse().slice(0, 5);
                const thisMonth = certificates.filter(c => {
                    if (!c.created_date) return false;
                    const d = new Date(c.created_date);
                    const now = new Date();
                    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
                }).length;

                content += `
                    <div class="page-header">
                        <div class="page-header-eyebrow">ACORD 25 · Compliance Suite</div>
                        <h1 class="page-header-title">A quicker way to issue certificates.</h1>
                        <p class="page-header-desc">Centralize producers, insureds, and policies — then reissue ACORD 25 certificates without re-entering a single field.</p>
                        <div class="page-header-actions">
                            <button class="btn btn-outline" onclick="openUploadModal()">📄 Upload ACORD</button>
                            <button class="btn btn-primary" onclick="navigateTo('certificate-builder')">➕ New Certificate</button>
                        </div>
                    </div>

                    <div class="stats-grid">
                        <div class="stat-card"><div class="stat-label">Certificates</div><div class="stat-value">${certificates.length}</div><div class="stat-hint">Issued & drafts</div></div>
                        <div class="stat-card"><div class="stat-label">Clients</div><div class="stat-value">${clients.length}</div><div class="stat-hint">Insureds on file</div></div>
                        <div class="stat-card"><div class="stat-label">Active Policies</div><div class="stat-value">${policies.length}</div><div class="stat-hint">Across all insureds</div></div>
                        <div class="stat-card"><div class="stat-label">This Month</div><div class="stat-value">${thisMonth}</div><div class="stat-hint">Newly generated</div></div>
                    </div>

                    <div>
                        <h2 style="font-size: 1.5rem; font-weight: 600; margin-bottom: 16px;">Quick actions</h2>
                        <div class="actions-grid">
                            <a href="#" onclick="navigateTo('certificate-builder'); return false;" class="action-tile"><div class="action-icon">➕</div><div class="action-title">Create Certificate</div><div class="action-desc">Start a new ACORD 25 — auto-fill from an existing insured.</div></a>
                            <a href="#" onclick="openUploadModal(); return false;" class="action-tile"><div class="action-icon">📄</div><div class="action-title">Upload ACORD PDF</div><div class="action-desc">Parse a certificate and save its data for reuse.</div></a>
                            <a href="#" onclick="navigateTo('clients'); return false;" class="action-tile"><div class="action-icon">👥</div><div class="action-title">Search Clients</div><div class="action-desc">Find insureds, view their policy history.</div></a>
                            <a href="#" onclick="navigateTo('certificates'); return false;" class="action-tile"><div class="action-icon">📋</div><div class="action-title">Saved Certificates</div><div class="action-desc">Browse, reissue, or duplicate certificates.</div></a>
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-4"><h2 style="font-size: 1.5rem; font-weight: 600;">Recent certificates</h2><a href="#" onclick="navigateTo('certificates'); return false;" style="font-size: 0.875rem; color: #71717a;">View all →</a></div>
                        ${recentCerts.length === 0 ? '<div class="text-center py-16" style="border: 1px dashed #e4e4e7; border-radius: 12px;"><p style="color: #71717a;">No certificates yet. Create one to begin.</p></div>' : `
                        <div class="table-container"><table><thead><tr><th>Number</th><th>Insured</th><th>Issue Date</th><th>Status</th><th></th></tr></thead><tbody>
                            ${recentCerts.map(c => `<tr><td>${c.certificate_number || '—'}</td><td>${getClientName(c.client_id)}</td><td>${formatDate(c.issue_date)}</td><td><span class="badge ${c.status === 'issued' ? 'badge-issued' : ''}">${c.status}</span></td><td><a href="#" onclick="viewCertificate('${c.id}'); return false;" style="color: #2563eb;">Open →</a></td></tr>`).join('')}
                        </tbody></table></div>`}
                    </div>
                `;
            }
            else if (currentView === 'certificates') {
                content += `
                    <div class="page-header"><div class="page-header-eyebrow">Archive</div><h1 class="page-header-title">Saved Certificates</h1><p class="page-header-desc">Every ACORD 25 ever issued — search, reissue, or duplicate.</p><div class="page-header-actions"><button class="btn btn-primary" onclick="navigateTo('certificate-builder')">➕ New Certificate</button></div></div>
                    ${certificates.length === 0 ? '<div class="text-center py-16" style="border: 1px dashed #e4e4e7; border-radius: 12px;"><p style="color: #71717a;">No certificates yet.</p></div>' : `
                    <div class="table-container"><table><thead><tr><th>Number</th><th>Insured</th><th>Producer</th><th>Issue Date</th><th>Status</th><th></th></tr></thead><tbody>
                        ${certificates.map(c => `<tr><td>${c.certificate_number || '—'}</td><td>${getClientName(c.client_id)}</td><td>${getProducerName(c.producer_id)}</td><td>${formatDate(c.issue_date)}</td><td><span class="badge ${c.status === 'issued' ? 'badge-issued' : ''}">${c.status}</span></td><td><a href="#" onclick="viewCertificate('${c.id}'); return false;" style="color: #2563eb;">Open →</a> <a href="#" onclick="duplicateCertificate('${c.id}'); return false;" style="color: #71717a; margin-left: 12px;">Copy</a></td></tr>`).join('')}
                    </tbody></table></div>`}
                `;
            }
            else if (currentView === 'clients') {
                content += `
                    <div class="page-header"><div class="page-header-eyebrow">Insureds</div><h1 class="page-header-title">Clients</h1><p class="page-header-desc">Every insured, their policies, and certificate history.</p><div class="page-header-actions"><button class="btn btn-primary" onclick="openClientModal()">➕ New Client</button></div></div>
                    ${clients.length === 0 ? '<div class="text-center py-16" style="border: 1px dashed #e4e4e7; border-radius: 12px;"><p style="color: #71717a;">No clients yet.</p></div>' : `
                    <div class="table-container"><table><thead><tr><th>Insured</th><th>DBA</th><th>Location</th><th>Policies</th><th></th></tr></thead><tbody>
                        ${clients.map(c => `<tr><td><strong>${c.name}</strong></td><td>${c.dba || '—'}</td><td>${[c.city, c.state].filter(Boolean).join(', ') || '—'}</td><td>${policies.filter(p => p.client_id === c.id).length}</td><td><a href="#" onclick="viewClient('${c.id}'); return false;" style="color: #2563eb;">Open →</a></td></tr>`).join('')}
                    </tbody></table></div>`}
                `;
            }
            else if (currentView === 'client-detail' && currentClientId) {
                const client = clients.find(c => c.id === currentClientId);
                const clientPolicies = policies.filter(p => p.client_id === currentClientId);
                const clientCerts = certificates.filter(c => c.client_id === currentClientId).reverse();

                if (client) {
                    content += `
                        <div class="page-header"><div><a href="#" onclick="navigateTo('clients'); return false;" style="font-size: 0.75rem; color: #71717a;">← All clients</a><h1 class="page-header-title" style="margin-top: 16px;">${client.name}</h1>${client.dba ? `<p>DBA: ${client.dba}</p>` : ''}<p style="color: #71717a; margin-top: 8px;">${[client.address_line1, client.city, client.state, client.zip].filter(Boolean).join(', ')}</p></div><div><button class="btn btn-outline" onclick="openClientModal('${client.id}')">✏️ Edit</button> <button class="btn btn-primary" onclick="navigateTo('certificate-builder', '${client.id}')">📄 New Certificate</button></div></div>
                        
                        <div class="form-section"><div class="form-section-title">Policies on file</div>${clientPolicies.length === 0 ? '<p style="color: #71717a;">No policies yet.</p>' : `<div class="table-container"><table><thead><tr><th>Coverage</th><th>Policy #</th><th>Effective</th><th>Expiration</th></tr></thead><tbody>${clientPolicies.map(p => `<tr><td>${p.coverage_type || '—'}</td><td>${p.policy_number || '—'}</td><td>${formatDate(p.effective_date)}</td><td>${formatDate(p.expiration_date)}</td></tr>`).join('')}</tbody></table></div>`}</div>
                        
                        <div class="form-section"><div class="form-section-title">Certificate history</div>${clientCerts.length === 0 ? '<p style="color: #71717a;">No certificates yet.</p>' : `<div class="table-container"><table><thead><tr><th>Certificate #</th><th>Issue Date</th><th>Status</th><th></th></tr></thead><tbody>${clientCerts.map(c => `<tr><td>${c.certificate_number || '—'}</td><td>${formatDate(c.issue_date)}</td><td><span class="badge">${c.status}</span></td><td><a href="#" onclick="viewCertificate('${c.id}'); return false;">Open →</a></td></tr>`).join('')}</tbody></table></div>`}</div>
                    `;
                }
            }
            else if (currentView === 'producers') {
                content += `
                    <div class="page-header"><div class="page-header-eyebrow">Brokers & Agencies</div><h1 class="page-header-title">Producers</h1><p class="page-header-desc">Saved producer blocks used on every ACORD certificate.</p><div class="page-header-actions"><button class="btn btn-primary" onclick="openProducerModal()">➕ New Producer</button></div></div>
                    <div class="actions-grid">
                        ${producers.map(p => `
                            <div class="action-tile" style="cursor: default;">
                                <div class="flex justify-between"><div><strong>${p.name}</strong>${p.dba ? `<div style="font-size: 0.75rem; color: #71717a;">${p.dba}</div>` : ''}</div><div><button class="btn btn-secondary" style="padding: 4px 8px;" onclick="openProducerModal('${p.id}')">✏️</button> <button class="btn btn-secondary" style="padding: 4px 8px;" onclick="deleteProducer('${p.id}')">🗑️</button></div></div>
                                <div style="font-size: 0.75rem; color: #71717a; margin-top: 12px;">${[p.address_line1, p.city, p.state, p.zip].filter(Boolean).join(', ') || 'No address'}</div>
                                ${p.phone ? `<div style="font-size: 0.75rem; margin-top: 4px;">📞 ${p.phone}</div>` : ''}
                            </div>
                        `).join('')}
                        ${producers.length === 0 ? '<div class="text-center py-16" style="border: 1px dashed #e4e4e7; border-radius: 12px;"><p style="color: #71717a;">No producers yet.</p></div>' : ''}
                    </div>
                `;
            }
            else if (currentView === 'insurers') {
                content += `
                    <div class="page-header"><div class="page-header-eyebrow">Carriers</div><h1 class="page-header-title">Insurers</h1><p class="page-header-desc">Insurance carriers mapped to Insurer A–F on each certificate.</p><div class="page-header-actions"><button class="btn btn-primary" onclick="openInsurerModal()">➕ New Insurer</button></div></div>
                    <div class="table-container"><table><thead><tr><th>Carrier</th><th>NAIC #</th><th></th></tr></thead><tbody>
                        ${insurers.map(i => `<tr><td><strong>${i.name}</strong></td><td>${i.naic_number || '—'}</td><td><button class="btn btn-secondary" style="padding: 4px 8px;" onclick="openInsurerModal('${i.id}')">✏️</button> <button class="btn btn-secondary" style="padding: 4px 8px;" onclick="deleteInsurer('${i.id}')">🗑️</button></td></tr>`).join('')}
                        ${insurers.length === 0 ? '<tr><td colspan="3" class="text-center" style="padding: 48px;">No insurers yet.</td></tr>' : ''}
                    </tbody></table></div>
                `;
            }
            else if (currentView === 'certificate-builder') {
                const isEdit = currentEditId !== null;

        function onClientChange(clientId) {
            const policies = getData(STORAGE_KEYS.POLICIES);

        function collectFormData() {
            const cert = formState.certificate;
            cert.certificate_number = document.getElementById('cert_number')?.value || cert.certificate_number;
            cert.revision_number = document.getElementById('revision_number')?.value || '';
            cert.issue_date = document.getElementById('issue_date')?.value || new Date().toISOString().slice(0,10);
            cert.producer_id = document.getElementById('producer_id')?.value || '';
            cert.client_id = document.getElementById('client_id')?.value || '';
            cert.certificate_holder_id = document.getElementById('holder_id')?.value || '';
            cert.description_of_operations = document.getElementById('description')?.value || '';
            cert.authorized_representative = document.getElementById('auth_rep')?.value || '';
            
            // Insurers
            cert.insurers_snapshot = ['A','B','C','D','E','F'].map(letter => ({
                letter,
                name: document.getElementById(`insurer_${letter}_name`)?.value || '',
                naic_number: document.getElementById(`insurer_${letter}_naic`)?.value || ''
            }));
            
            // Policies
            const policies = [];
            for (let i = 0; i < (formState.certificate.policies || []).length; i++) {
                policies.push({
                    coverage_type: document.getElementById(`policy_${i}_type`)?.value || '',

                    effective_date: document.getElementById(`policy_${i}_effective`)?.value || '',
                    expiration_date: document.getElementById(`policy_${i}_expiration`)?.value || '',
                    insurer_letter: document.getElementById(`policy_${i}_insurer`)?.value || ''
                });
            }
            cert.policies = policies;
            
            return cert;

        function saveCertificate(status) {
            const certData = collectFormData();
            if (!certData.client_id) {
                alert('Please select a client');
                return;
            }
            
            certData.status = status;
            certData.created_date = new Date().toISOString();
            
            // Save policies first
            const savedPolicies = [];
            for (const pol of (certData.policies || [])) {
                const newPolicy = {
                    id: generateId(),
                    ...pol,
                    client_id: certData.client_id,
                    created_date: new Date().toISOString()
                };
                const policies = getData(STORAGE_KEYS.POLICIES);
                policies.push(newPolicy);
                setData(STORAGE_KEYS.POLICIES, policies);
                savedPolicies.push(newPolicy.id);
            }
            certData.policy_ids = savedPolicies;
            
            const certificates = getData(STORAGE_KEYS.CERTIFICATES);
            
            if (currentEditId) {
                const idx = certificates.findIndex(c => c.id === currentEditId);
                if (idx !== -1) {
                    certData.id = currentEditId;
                    certificates[idx] = certData;
                }
            } else {
                certData.id = generateId();
                certificates.push(certData);
            }
            
            setData(STORAGE_KEYS.CERTIFICATES, certificates);
            
            // Reset form state
            formState.certificate = {
                certificate_number: generateCertificateNumber(),
                revision_number: '',
                issue_date: new Date().toISOString().slice(0, 10),
                client_id: '',
                producer_id: '',
                certificate_holder_id: '',
                description_of_operations: '',
                authorized_representative: '',
                policies: [],
                insurers_snapshot: [
                    { letter: 'A', name: '', naic_number: '' },
                    { letter: 'B', name: '', naic_number: '' },
                    { letter: 'C', name: '', naic_number: '' },
                    { letter: 'D', name: '', naic_number: '' },
                    { letter: 'E', name: '', naic_number: '' },
                    { letter: 'F', name: '', naic_number: '' }
                ],
                status: 'draft'
            };
            currentEditId = null;
            navigateTo('certificates');
        }

        function editCertificate(id) {
            currentEditId = id;
            const certificates = getData(STORAGE_KEYS.CERTIFICATES);

            if (cert) {
                formState.certificate = { ...cert };

        function duplicateCertificate(id) {
            const certificates = getData(STORAGE_KEYS.CERTIFICATES);
            const original = certificates.find(c => c.id === id);
            if (original) {
                const copy = { ...original };
                delete copy.id;
                copy.certificate_number = generateCertificateNumber();
                copy.status = 'draft';
                copy.issue_date = new Date().toISOString().slice(0, 10);
                copy.created_date = new Date().toISOString();
                copy.id = generateId();
                certificates.push(copy);
                setData(STORAGE_KEYS.CERTIFICATES, certificates);
                alert('Certificate duplicated as draft');
                navigateTo('certificates');
            }
        }

                certificates = certificates.filter(c => c.id !== id);
                setData(STORAGE_KEYS.CERTIFICATES, certificates);
                navigateTo('certificates');

                        <div class="form-grid">
                            <div class="form-field"><label>Name *</label><input type="text" id="insurer_name" value="${insurer?.name || ''}"></div>
                            <div class="form-field"><label>NAIC Number</label><input type="text" id="insurer_naic" value="${insurer?.naic_number || ''}"></div>
                        </div>
                        <div class="flex justify-end gap-2" style="margin-top: 24px;">
                            <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
                            <button class="btn btn-primary" onclick="saveInsurer('${id || ''}')">Save</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', html);
        }

        function saveInsurer(id) {
            const name = document.getElementById('insurer_name')?.value;
            if (!name) { alert('Name is required'); return; }
            
            const insurer = {
                id: id || generateId(),
                name,
                naic_number: document.getElementById('insurer_naic')?.value || '',
                created_date: new Date().toISOString()
            };
            
            const insurers = getData(STORAGE_KEYS.INSURERS);
            if (id) {
                const idx = insurers.findIndex(i => i.id === id);
                if (idx !== -1) insurers[idx] = insurer;
            } else {
                insurers.push(insurer);
            }
            setData(STORAGE_KEYS.INSURERS, insurers);
            closeModal();
            render();
        }

        function deleteInsurer(id) {
            if (confirm('Delete this insurer?')) {
                let insurers = getData(STORAGE_KEYS.INSURERS);
                insurers = insurers.filter(i => i.id !== id);
                setData(STORAGE_KEYS.INSURERS, insurers);
                render();
            }
        }

        function openUploadModal() {
            alert('PDF upload functionality: In production, this would use AI to extract ACORD fields from PDFs. For this demo, you can manually enter data using the Create Certificate form.');
            navigateTo('certificate-builder');
        }

        function closeModal() {
            const overlay = document.getElementById('modalOverlay');
            if (overlay) overlay.remove();
        }

        function navigateTo(view, param = null) {
            currentView = view;
            currentEditId = null;
            if (view === 'certificate-builder') {
                currentEditId = null;
                formState.certificate = {
                    certificate_number: generateCertificateNumber(),
                    revision_number: '',
                    issue_date: new Date().toISOString().slice(0, 10),
                    client_id: param || '',
                    producer_id: '',
                    certificate_holder_id: '',
                    description_of_operations: '',
                    authorized_representative: '',
                    policies: [],
                    insurers_snapshot: [
                        { letter: 'A', name: '', naic_number: '' },
                        { letter: 'B', name: '', naic_number: '' },
                        { letter: 'C', name: '', naic_number: '' },
                        { letter: 'D', name: '', naic_number: '' },
                        { letter: 'E', name: '', naic_number: '' },
                        { letter: 'F', name: '', naic_number: '' }
                    ],
                    status: 'draft'
                };
            }
            render();
        }

        // Make functions global
        window.navigateTo = navigateTo;
        window.viewCertificate = viewCertificate;
        window.editCertificate = editCertificate;
        window.duplicateCertificate = duplicateCertificate;
        window.deleteCertificate = deleteCertificate;
        window.downloadPDF = downloadPDF;
        window.viewClient = viewClient;
        window.openClientModal = openClientModal;
        window.openProducerModal = openProducerModal;
        window.openHolderModal = openHolderModal;
        window.openInsurerModal = openInsurerModal;
        window.deleteProducer = deleteProducer;
        window.deleteInsurer = deleteInsurer;
        window.saveClient = saveClient;
        window.saveProducer = saveProducer;
        window.saveHolder = saveHolder;
        window.saveInsurer = saveInsurer;
        window.closeModal = closeModal;
        window.addPolicyField = addPolicyField;
        window.removePolicy = removePolicy;
        window.onClientChange = onClientChange;
        window.saveCertificate = saveCertificate;
        window.copyHolderFromInsured = copyHolderFromInsured;
        window.openUploadModal = openUploadModal;

        // Initial render
        render();
    </script>
</body>
</html>
