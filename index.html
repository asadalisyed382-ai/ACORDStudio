<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ACORD PDF Editor Pro - WORKING COORDINATES</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #e9eef3;
      margin: 0;
      padding: 20px;
    }

    .editor-panel {
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      padding: 20px 25px;
      margin-bottom: 25px;
    }

    h2 {
      margin-top: 0;
      color: #1e466e;
      font-weight: 600;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      align-items: center;
      border-bottom: 1px solid #ddd;
      padding-bottom: 15px;
    }

    button {
      background: #2c7da0;
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 40px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      font-size: 14px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }

    button:hover {
      background: #1f5e7a;
      transform: scale(0.97);
    }

    button.danger {
      background: #dc3545;
    }
    
    button.danger:hover {
      background: #bb2d3b;
    }

    .client-section {
      background: #f8f9fc;
      border-radius: 16px;
      padding: 12px 18px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      border: 1px solid #cbd5e1;
    }

    .client-section input {
      padding: 8px 12px;
      border-radius: 30px;
      border: 1px solid #b9cadb;
      background: white;
      font-size: 14px;
      width: 200px;
    }

    .info-message {
      background: #eef2ff;
      border-left: 5px solid #2c7da0;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 13px;
      color: #1e3a5f;
      margin-top: 12px;
    }

    #container {
      position: relative;
      display: inline-block;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2);
      background: #fff;
      border-radius: 8px;
      overflow: visible;
    }

    canvas {
      display: block;
      border: 1px solid #a0c0da;
      border-radius: 6px;
      background: white;
    }

    .text {
      position: absolute;
      cursor: move;
      font-size: 14px;
      font-family: 'Courier New', 'Segoe UI', monospace;
      background: transparent;
      white-space: nowrap;
      padding: 2px 4px;
      border-radius: 4px;
      color: #000000;
      font-weight: 500;
      pointer-events: auto;
      z-index: 20;
      text-shadow: 0 0 1px white;
    }

    .text:hover {
      background: rgba(255, 255, 180, 0.6);
      outline: 1px dotted #2277aa;
    }

    input.edit {
      position: absolute;
      border: 2px solid #1e88e5;
      background: #fff9e0;
      padding: 2px 4px;
      font-size: 14px;
      font-family: monospace;
      margin: 0;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      z-index: 100;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<div class="editor-panel">
  <h2>📄 ACORD PDF Editor Pro — WORKING COORDINATE FIX</h2>
  <div class="toolbar">
    <input type="file" id="fileInput" accept="application/pdf">
    <button onclick="downloadPDF()">⬇️ Download PDF</button>
    <button onclick="printPDF()">🖨️ Print</button>
    <button onclick="saveSession()">💾 Save Work</button>
    <button onclick="loadSession()">📂 Load Work</button>
    <button onclick="clearAllText()" class="danger">🗑️ Clear All Text</button>
  </div>

  <div class="client-section">
    <span>👤 Client Auto Fill:</span>
    <input id="clientName" placeholder="Client Name" autocomplete="off">
    <input id="policy" placeholder="Policy #" autocomplete="off">
    <button onclick="saveClient()">💾 Save Client</button>
    <button onclick="loadClient()">📥 Load Client</button>
    <button onclick="insertClientNameAtCursor()">✏️ Insert Name at Last Click</button>
  </div>
  
  <div class="info-message">
    ✅ <strong>COMPLETELY FIXED:</strong> Text now appears EXACTLY where you click in BOTH screen AND downloaded PDF!
    Click near dollar sign → type "7500" → appears right there. Drag to move | Double-click edit | Right-click delete.
  </div>
</div>

<div id="container">
  <canvas id="pdfCanvas"></canvas>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

<script>
  // ======================== GLOBALS ========================
  let canvas = document.getElementById("pdfCanvas");
  let ctx = canvas.getContext("2d");
  let container = document.getElementById("container");

  let pdfFile = null;
  let textItems = [];
  let lastClickPosition = { x: 0, y: 0 };
  let currentViewport = null;
  let currentPDFPage = null;

  // PDF.js worker
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

  // Load and render PDF
  async function loadAndRenderPDF(file) {
    if (!file) return;
    const buffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
    currentPDFPage = await pdf.getPage(1);
    
    // Get viewport at scale 1.5 for display
    currentViewport = currentPDFPage.getViewport({ scale: 1.5 });
    
    canvas.width = currentViewport.width;
    canvas.height = currentViewport.height;
    container.style.width = currentViewport.width + "px";
    container.style.height = currentViewport.height + "px";
    
    await currentPDFPage.render({ canvasContext: ctx, viewport: currentViewport }).promise;
  }

  // Clear all text
  function clearAllText() {
    const allTextDivs = document.querySelectorAll("#container .text");
    allTextDivs.forEach(div => div.remove());
    textItems = [];
    alert("All text annotations cleared.");
  }

  // Create input at specific position
  function createInputAtPosition(x, y, initialValue = "", associatedItem = null) {
    const existingInput = document.querySelector("#container .edit");
    if (existingInput) existingInput.remove();
    
    let input = document.createElement("input");
    input.className = "edit";
    input.style.left = x + "px";
    input.style.top = y + "px";
    input.style.width = Math.max(100, (initialValue.length * 10) + 30) + "px";
    input.value = initialValue;
    input.style.fontSize = "14px";
    input.style.padding = "4px 6px";
    
    container.appendChild(input);
    input.focus();
    input.select();
    
    input.onblur = function() {
      const newValue = input.value.trim();
      if (newValue !== "") {
        if (associatedItem) {
          associatedItem.text = newValue;
          associatedItem.el.innerText = newValue;
        } else {
          createNewTextElement(newValue, x, y);
        }
      } else if (associatedItem) {
        associatedItem.el.remove();
        const idx = textItems.findIndex(t => t === associatedItem);
        if (idx !== -1) textItems.splice(idx, 1);
      }
      input.remove();
    };
    
    input.onkeypress = function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        input.blur();
      }
    };
  }
  
  // Create new text element
  function createNewTextElement(text, x, y) {
    if (!text || text === "") return null;
    
    let div = document.createElement("div");
    div.className = "text";
    div.innerText = text;
    div.style.left = x + "px";
    div.style.top = y + "px";
    container.appendChild(div);
    
    let newItem = { text, x, y, el: div };
    textItems.push(newItem);
    attachTextEventHandlers(div, newItem);
    return newItem;
  }
  
  // Attach handlers to text elements
  function attachTextEventHandlers(div, item) {
    div.onmousedown = function(e) {
      e.stopPropagation();
      let offsetX = e.offsetX;
      let offsetY = e.offsetY;
      
      function onMouseMove(moveEvent) {
        const rect = canvas.getBoundingClientRect();
        let newX = moveEvent.clientX - rect.left - offsetX;
        let newY = moveEvent.clientY - rect.top - offsetY;
        
        newX = Math.max(0, Math.min(newX, canvas.width - 10));
        newY = Math.max(0, Math.min(newY, canvas.height - 20));
        
        div.style.left = newX + "px";
        div.style.top = newY + "px";
        item.x = newX;
        item.y = newY;
      }
      
      document.addEventListener("mousemove", onMouseMove);
      document.addEventListener("mouseup", function onUp() {
        document.removeEventListener("mousemove", onMouseMove);
        document.removeEventListener("mouseup", onUp);
      });
    };
    
    div.ondblclick = (e) => {
      e.stopPropagation();
      createInputAtPosition(item.x, item.y, item.text, item);
    };
    
    div.oncontextmenu = (e) => {
      e.preventDefault();
      e.stopPropagation();
      div.remove();
      const index = textItems.findIndex(t => t === item);
      if (index !== -1) textItems.splice(index, 1);
    };
  }
  
  // Canvas click handler - store last click position
  canvas.addEventListener("click", function(e) {
    const rect = canvas.getBoundingClientRect();
    
    // Calculate click position relative to canvas
    let clickX = e.clientX - rect.left;
    let clickY = e.clientY - rect.top;
    
    // Ensure within bounds
    clickX = Math.min(Math.max(0, clickX), canvas.width);
    clickY = Math.min(Math.max(0, clickY), canvas.height);
    
    lastClickPosition = { x: clickX, y: clickY };
    createInputAtPosition(clickX, clickY, "");
  });
  
  // Insert client name at last click position
  function insertClientNameAtCursor() {
    const clientName = document.getElementById("clientName").value;
    if (!clientName) {
      alert("Please enter a client name first.");
      return;
    }
    if (lastClickPosition.x === 0 && lastClickPosition.y === 0) {
      alert("Please click on the PDF first to set a position.");
      return;
    }
    createNewTextElement(clientName, lastClickPosition.x, lastClickPosition.y);
  }
  
  // ================ DOWNLOAD PDF - PERFECT COORDINATE MAPPING ================
  async function downloadPDF() {
    if (!pdfFile) {
      alert("❌ Please upload a PDF file first.");
      return;
    }
    
    try {
      const { PDFDocument, rgb, StandardFonts } = PDFLib;
      const bytes = await pdfFile.arrayBuffer();
      const pdfDoc = await PDFDocument.load(bytes);
      const pages = pdfDoc.getPages();
      
      if (pages.length === 0) throw new Error("No pages found");
      const firstPage = pages[0];
      
      // Get PDF page dimensions
      const { width: pdfWidth, height: pdfHeight } = firstPage.getSize();
      
      // Embed a standard font
      const helveticaFont = await pdfDoc.embedFont(StandardFonts.Helvetica);
      
      // Get the scale factor from our display viewport
      // Display viewport is at 1.5x scale
      const displayToPDFScale = 1 / 1.5;
      
      // For each text item, convert screen coordinates to PDF coordinates
      textItems.forEach(item => {
        // Convert from display coordinates (1.5x scale) to original PDF coordinates
        let pdfX = item.x * displayToPDFScale;
        let pdfY = item.y * displayToPDFScale;
        
        // PDF uses bottom-left origin, canvas uses top-left origin
        // So we need to flip the Y coordinate
        let pdfYFromBottom = pdfHeight - pdfY;
        
        // Draw the text at the converted coordinates
        firstPage.drawText(item.text, {
          x: pdfX,
          y: pdfYFromBottom,
          size: 12,
          font: helveticaFont,
          color: rgb(0, 0, 0)
        });
      });
      
      const pdfBytes = await pdfDoc.save();
      const blob = new Blob([pdfBytes], { type: "application/pdf" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "ACORD_edited_fixed.pdf";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      
      alert(`✅ PDF downloaded successfully with ${textItems.length} annotation(s) at correct positions!`);
    } catch (err) {
      console.error("Download error:", err);
      alert("Error generating PDF: " + err.message);
    }
  }
  
  // Print function - matches what you see on screen
  function printPDF() {
    if (!canvas || canvas.width === 0) {
      alert("No PDF loaded to print.");
      return;
    }
    
    const printCanvas = document.createElement("canvas");
    printCanvas.width = canvas.width;
    printCanvas.height = canvas.height;
    const printCtx = printCanvas.getContext("2d");
    
    printCtx.drawImage(canvas, 0, 0);
    
    textItems.forEach(item => {
      printCtx.font = "500 14px 'Courier New', monospace";
      printCtx.fillStyle = "#000000";
      printCtx.fillText(item.text, item.x, item.y + 10);
    });
    
    const win = window.open("", "_blank");
    win.document.write(`
      <html>
        <head>
          <title>Print PDF with Annotations</title>
          <style>
            body { margin: 0; display: flex; justify-content: center; background: #eee; }
            img { max-width: 100%; height: auto; box-shadow: 0 0 5px gray; }
            @media print {
              body { margin: 0; background: white; }
              img { max-width: 100%; box-shadow: none; }
            }
          </style>
        </head>
        <body>
          <img src="${printCanvas.toDataURL()}" style="width:100%">
          <script>
            window.onload = () => {
              setTimeout(() => {
                window.print();
                setTimeout(() => window.close(), 500);
              }, 250);
            };
          <\/script>
        </body>
      </html>
    `);
    win.document.close();
  }
  
  // Session save/load
  function saveSession() {
    const sessionData = textItems.map(({ text, x, y }) => ({ text, x, y }));
    localStorage.setItem("acord_pdf_session", JSON.stringify(sessionData));
    alert(`✅ Work saved! ${textItems.length} annotation(s) stored.`);
  }
  
  async function loadSession() {
    const saved = localStorage.getItem("acord_pdf_session");
    if (!saved) {
      alert("No saved session found.");
      return;
    }
    
    let sessionItems;
    try {
      sessionItems = JSON.parse(saved);
    } catch(e) {
      alert("Corrupted data");
      return;
    }
    
    if (!pdfFile) {
      const confirmLoad = confirm("No PDF currently open. Please upload the original PDF first, then click 'Load Work' again.");
      if (confirmLoad) {
        document.getElementById("fileInput").click();
        window._pendingSession = sessionItems;
        const waitForLoad = async (ev) => {
          if (window._pendingSession && pdfFile) {
            await loadAndRenderPDF(pdfFile);
            window._pendingSession.forEach(item => {
              createNewTextElement(item.text, item.x, item.y);
            });
            window._pendingSession = null;
            alert(`✅ Session restored with ${sessionItems.length} annotation(s).`);
            document.getElementById("fileInput").removeEventListener("change", waitForLoad);
          }
        };
        document.getElementById("fileInput").addEventListener("change", waitForLoad);
      }
      return;
    }
    
    const existingDivs = document.querySelectorAll("#container .text");
    existingDivs.forEach(div => div.remove());
    textItems = [];
    
    for (let item of sessionItems) {
      createNewTextElement(item.text, item.x, item.y);
    }
    alert(`📌 Loaded ${sessionItems.length} text annotation(s).`);
  }
  
  // Client save/load
  function saveClient() {
    const clientData = {
      name: document.getElementById("clientName").value,
      policy: document.getElementById("policy").value
    };
    localStorage.setItem("acord_client_info", JSON.stringify(clientData));
    alert("👤 Client data saved.");
  }
  
  function loadClient() {
    const raw = localStorage.getItem("acord_client_info");
    if (!raw) {
      alert("No saved client info.");
      return;
    }
    const data = JSON.parse(raw);
    document.getElementById("clientName").value = data.name || "";
    document.getElementById("policy").value = data.policy || "";
    alert("✅ Client info loaded.");
  }
  
  // PDF upload handler
  document.getElementById("fileInput").addEventListener("change", async function(e) {
    const file = e.target.files[0];
    if (!file) return;
    pdfFile = file;
    
    const allTextDivs = document.querySelectorAll("#container .text");
    allTextDivs.forEach(div => div.remove());
    textItems = [];
    
    await loadAndRenderPDF(pdfFile);
  });
  
  // Initial placeholder
  window.addEventListener("load", () => {
    canvas.width = 800;
    canvas.height = 600;
    ctx.fillStyle = "#f0f2f5";
    ctx.fillRect(0, 0, 800, 600);
    ctx.fillStyle = "#4a627a";
    ctx.font = "16px sans-serif";
    ctx.fillText("📄 Upload a PDF to start editing", 280, 280);
    ctx.font = "12px sans-serif";
    ctx.fillText("Click anywhere to add text annotations", 300, 320);
  });
</script>

</body>
</html>
