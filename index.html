<!DOCTYPE html>
<html>
<head>
  <title>ACORD PDF Editor Pro</title>

  <style>
    body { font-family: Arial; }

    #container {
      position: relative;
      display: inline-block;
    }

    canvas {
      border: 1px solid black;
    }

    .text {
      position: absolute;
      cursor: move;
      font-size: 16px;
    }

    input.edit {
      position: absolute;
      border: 1px solid blue;
    }
  </style>
</head>

<body>

<h2>PDF Editor (Working Version)</h2>

<input type="file" id="fileInput">
<button onclick="downloadPDF()">Download PDF</button>
<button onclick="printPDF()">Print</button>
<button onclick="saveSession()">Save Work</button>
<button onclick="loadSession()">Load Work</button>

<br><br>

<h3>Client Auto Fill</h3>
<input id="clientName" placeholder="Client Name">
<input id="policy" placeholder="Policy #">
<button onclick="saveClient()">Save Client</button>
<button onclick="loadClient()">Load Client</button>

<br><br>

<div id="container">
  <canvas id="pdfCanvas"></canvas>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

<script>
let canvas = document.getElementById("pdfCanvas");
let ctx = canvas.getContext("2d");
let container = document.getElementById("container");

let pdfFile = null;
let textItems = [];

// LOAD PDF
document.getElementById("fileInput").addEventListener("change", async function(e) {
  pdfFile = e.target.files[0];
  const buffer = await pdfFile.arrayBuffer();

  const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
  const page = await pdf.getPage(1);

  const viewport = page.getViewport({ scale: 1.5 });
  canvas.width = viewport.width;
  canvas.height = viewport.height;

  await page.render({ canvasContext: ctx, viewport }).promise;
});

// CLICK TO TYPE
canvas.addEventListener("click", function(e) {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  createInput(x, y, "");
});

function createInput(x, y, value) {
  let input = document.createElement("input");
  input.className = "edit";
  input.style.left = x + "px";
  input.style.top = y + "px";
  input.value = value;

  container.appendChild(input);
  input.focus();

  input.onblur = function() {
    if (input.value !== "") {
      createText(input.value, x, y);
    }
    input.remove();
  };
}

// CREATE TEXT
function createText(text, x, y) {
  let div = document.createElement("div");
  div.className = "text";
  div.innerText = text;
  div.style.left = x + "px";
  div.style.top = y + "px";

  container.appendChild(div);

  let item = { text, x, y, el: div };
  textItems.push(item);

  // DRAG
  div.onmousedown = function(e) {
    let offsetX = e.offsetX;
    let offsetY = e.offsetY;

    document.onmousemove = function(e) {
      const rect = canvas.getBoundingClientRect();
      let newX = e.clientX - rect.left - offsetX;
      let newY = e.clientY - rect.top - offsetY;

      div.style.left = newX + "px";
      div.style.top = newY + "px";

      item.x = newX;
      item.y = newY;
    };

    document.onmouseup = function() {
      document.onmousemove = null;
    };
  };

  // EDIT
  div.ondblclick = () => {
    createInput(item.x, item.y, item.text);
    div.remove();
    textItems = textItems.filter(t => t !== item);
  };

  // DELETE
  div.oncontextmenu = (e) => {
    e.preventDefault();
    div.remove();
    textItems = textItems.filter(t => t !== item);
  };
}

// DOWNLOAD FIXED
async function downloadPDF() {
  if (!pdfFile) return alert("Upload PDF first");

  const { PDFDocument, rgb } = PDFLib;

  const bytes = await pdfFile.arrayBuffer();
  const pdfDoc = await PDFDocument.load(bytes);
  const page = pdfDoc.getPages()[0];

  textItems.forEach(item => {
    page.drawText(item.text, {
      x: item.x,
      y: page.getHeight() - item.y,
      size: 12,
      color: rgb(0,0,0)
    });
  });

  const pdfBytes = await pdfDoc.save();

  const blob = new Blob([pdfBytes], { type: "application/pdf" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "edited.pdf";
  document.body.appendChild(a);
  a.click();
  a.remove();
}

// PRINT
function printPDF() {
  const canvasImage = canvas.toDataURL();
  const win = window.open("");
  win.document.write("<img src='" + canvasImage + "' style='width:100%'>");
  win.print();
}

// SAVE SESSION
function saveSession() {
  localStorage.setItem("pdfData", JSON.stringify(textItems));
  alert("Saved!");
}

// LOAD SESSION
function loadSession() {
  const data = JSON.parse(localStorage.getItem("pdfData") || "[]");

  data.forEach(item => {
    createText(item.text, item.x, item.y);
  });
}

// CLIENT SAVE
function saveClient() {
  const data = {
    name: document.getElementById("clientName").value,
    policy: document.getElementById("policy").value
  };

  localStorage.setItem("client", JSON.stringify(data));
  alert("Client Saved");
}

// CLIENT LOAD
function loadClient() {
  const data = JSON.parse(localStorage.getItem("client") || "{}");

  document.getElementById("clientName").value = data.name || "";
  document.getElementById("policy").value = data.policy || "";
}
</script>

</body>
</html>
