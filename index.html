<!DOCTYPE html>
<html>
<head>
  <title>ACORD PDF Editor</title>
</head>
<body>

<h2>Upload PDF</h2>
<input type="file" id="fileInput">

<br><br>

<canvas id="pdfCanvas"></canvas>

<br><br>

<input type="text" id="textInput" placeholder="Enter text">
<button onclick="addText()">Add Text</button>

<button onclick="downloadPDF()">Download PDF</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

<script>
let pdfDoc = null;
let page = null;
let textItems = [];

document.getElementById("fileInput").addEventListener("change", async function(e) {
  const file = e.target.files[0];
  const arrayBuffer = await file.arrayBuffer();

  pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  page = await pdfDoc.getPage(1);

  const viewport = page.getViewport({ scale: 1.5 });
  const canvas = document.getElementById("pdfCanvas");
  const context = canvas.getContext("2d");

  canvas.height = viewport.height;
  canvas.width = viewport.width;

  await page.render({
    canvasContext: context,
    viewport: viewport
  }).promise;
});

function addText() {
  const text = document.getElementById("textInput").value;
  textItems.push({ text, x: 100, y: 100 + textItems.length * 30 });

  const ctx = document.getElementById("pdfCanvas").getContext("2d");
  ctx.fillText(text, 100, 100 + textItems.length * 30);
}

async function downloadPDF() {
  const { PDFDocument, rgb } = PDFLib;

  const file = document.getElementById("fileInput").files[0];
  const bytes = await file.arrayBuffer();

  const pdfDoc = await PDFDocument.load(bytes);
  const page = pdfDoc.getPages()[0];

  textItems.forEach(item => {
    page.drawText(item.text, {
      x: item.x,
      y: page.getHeight() - item.y,
      size: 12,
      color: rgb(0, 0, 0),
    });
  });

  const pdfBytes = await pdfDoc.save();

  const blob = new Blob([pdfBytes], { type: "application/pdf" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "edited.pdf";
  link.click();
}
</script>

</body>
</html>
