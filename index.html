<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

<script>
let pdfDoc = null;
let page = null;
let canvas = document.getElementById("pdfCanvas");
let ctx = canvas.getContext("2d");

let textItems = [];
let activeText = null;

document.getElementById("fileInput").addEventListener("change", async function(e) {
  const file = e.target.files[0];
  const arrayBuffer = await file.arrayBuffer();

  pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  page = await pdfDoc.getPage(1);

  const viewport = page.getViewport({ scale: 1.5 });
  canvas.height = viewport.height;
  canvas.width = viewport.width;

  await page.render({ canvasContext: ctx, viewport }).promise;

  drawTexts();
});

// CLICK TO ADD TEXT BOX
canvas.addEventListener("click", function(e) {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  createEditableText(x, y, "");
});

// CREATE EDITABLE TEXT INPUT ON CANVAS
function createEditableText(x, y, value) {
  const input = document.createElement("input");
  input.type = "text";
  input.value = value;
  input.style.position = "absolute";
  input.style.left = x + "px";
  input.style.top = y + "px";
  input.style.fontSize = "16px";
  input.style.border = "1px solid blue";
  input.style.background = "transparent";

  document.body.appendChild(input);
  input.focus();

  input.onblur = () => {
    const text = input.value;
    if (text.trim() !== "") {
      textItems.push({ text, x, y });
      drawTexts();
    }
    document.body.removeChild(input);
  };
}

// DRAW ALL TEXTS
function drawTexts() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  page.render({
    canvasContext: ctx,
    viewport: page.getViewport({ scale: 1.5 })
  });

  ctx.font = "16px Arial";
  ctx.fillStyle = "black";

  textItems.forEach(item => {
    ctx.fillText(item.text, item.x, item.y);
  });
}

// SAVE PDF
async function downloadPDF() {
  const { PDFDocument, rgb } = PDFLib;

  const file = document.getElementById("fileInput").files[0];
  const bytes = await file.arrayBuffer();

  const pdfDoc = await PDFDocument.load(bytes);
  const page = pdfDoc.getPages()[0];

  textItems.forEach(item => {
    page.drawText(item.text, {
      x: item.x,
      y: page.getHeight() - item.y,
      size: 12,
      color: rgb(0, 0, 0),
    });
  });

  const pdfBytes = await pdfDoc.save();

  const blob = new Blob([pdfBytes], { type: "application/pdf" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "edited.pdf";
  link.click();
}

// SAVE SESSION
function saveSession() {
  localStorage.setItem("pdfEdits", JSON.stringify(textItems));
  alert("Saved!");
}

// LOAD SESSION
function loadSession() {
  textItems = JSON.parse(localStorage.getItem("pdfEdits") || "[]");
  drawTexts();
}
</script>
